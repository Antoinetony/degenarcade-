<style>
:root{--bg:#08080f;--surface:#0e0e1c;--card:#13132a;--border:#1e1e3a;--accent:#e63946;--gold:#f4a261;--text:#eeeeff;--muted:#7a7ab8;--r:12px;--fd:'Arial Black',Impact,sans-serif;--fb:'Segoe UI',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:70px}
nav{position:sticky;top:0;z-index:200;background:rgba(8,8,15,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{font-family:var(--fd);font-size:clamp(1rem,4vw,1.3rem);background:linear-gradient(90deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;letter-spacing:-.5px}
.pill{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:.65rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase}

/* glowing side margins */
body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:clamp(14px,5vw,70px);pointer-events:none;z-index:1;animation:glow 4s ease-in-out infinite alternate}
body::before{left:0;background:linear-gradient(90deg,rgba(230,57,70,.55),rgba(244,162,97,.18) 55%,transparent);box-shadow:inset 3px 0 14px rgba(230,57,70,.9)}
body::after{right:0;background:linear-gradient(270deg,rgba(124,92,255,.55),rgba(230,57,70,.18) 55%,transparent);box-shadow:inset -3px 0 14px rgba(124,92,255,.9);animation-delay:-2s}
@keyframes glow{from{opacity:.55}to{opacity:1}}
nav{z-index:200}
.wrap{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:0 14px}
.hero{text-align:center;padding:22px 0 12px}
.hero h1{font-family:var(--fd);font-size:clamp(1.4rem,6vw,2.2rem);line-height:1.1;letter-spacing:-1px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:.82rem;color:var(--muted);margin-top:6px}

/* the two big choices */
.picks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.pick{position:relative;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--card);cursor:pointer;aspect-ratio:4/5;display:flex;align-items:flex-end;padding:0;color:var(--text);text-align:left;font-family:inherit;transition:transform .15s,border-color .15s}
.pick:active{transform:scale(.98)}
.pick:hover{border-color:var(--accent)}
.pick .bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pick .bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pick .bg .wm{position:relative;font-family:var(--fd);text-transform:uppercase;text-align:center;line-height:.95;letter-spacing:-1px;font-size:clamp(1.7rem,9vw,2.8rem);padding:0 8px;margin-bottom:34px}
.pick.slope .bg{background:radial-gradient(circle at 50% 35%,#0f5a3a 0%,#06140e 75%)}
.pick.slope .wm{color:#eafff4;text-shadow:0 0 6px #2dffa0,0 0 18px #19d982,0 0 38px #19d982;transform:skewY(-6deg)}
.pick.gd .bg{background:radial-gradient(circle at 50% 35%,#5a1a6a 0%,#10061a 75%)}
.pick.gd .wm{font-size:clamp(1.25rem,6.6vw,2.3rem);color:#fff8d8;text-shadow:0 0 6px #ffd23a,0 0 18px #ff9f1a,0 0 38px #c24bff;-webkit-text-stroke:1px rgba(0,0,0,.4)}
.pick{box-shadow:0 0 0 1px var(--border)}
.pick.slope:hover{box-shadow:0 0 24px rgba(45,255,160,.45)}
.pick.gd:hover{box-shadow:0 0 24px rgba(194,75,255,.5)}
.pick .info{position:relative;width:100%;padding:12px;background:linear-gradient(transparent,rgba(8,8,15,.95) 60%)}
.pick .nm{font-family:var(--fd);font-size:1.05rem}
.pick .tg{display:inline-block;margin-top:4px;font-size:.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.pick .play{display:block;margin-top:8px;background:var(--accent);color:#fff;text-align:center;border-radius:8px;padding:8px;font-weight:700;font-size:.8rem}
@media(min-width:700px){.pick{aspect-ratio:16/9}}

/* player */
#player{display:none;margin-top:6px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
#player.on{display:block}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border)}
.ph .t{font-family:var(--fd);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;gap:6px;flex-shrink:0}
.btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:.72rem;cursor:pointer;font-family:inherit}
.btn:hover,.btn:active{border-color:var(--accent);color:var(--accent)}
.frame{position:relative;width:100%;background:#000;aspect-ratio:16/10}
@media(max-width:699px){.frame{aspect-ratio:3/4}}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.ldr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--card);z-index:2;transition:opacity .4s}
.ldr.h{opacity:0;pointer-events:none}
.ring{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.pf{padding:8px 12px;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border)}

.adw{margin:16px 0;min-height:60px;display:flex;align-items:center;justify-content:center;overflow:hidden}

/* browse */
.bar{display:flex;gap:8px;margin-top:18px}
#q{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:16px;font-family:inherit;outline:none}
#q:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:.75rem;cursor:pointer;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
h2.sec{font-family:var(--fd);font-size:1rem;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(6,1fr)}}
.g{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;padding:0;color:var(--text);text-align:left;font-family:inherit;transition:transform .12s,border-color .12s}
.g:active{transform:scale(.97)}
.g:hover{border-color:var(--accent)}
.g img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#000}
.g span{display:block;padding:6px 7px;font-size:.68rem;line-height:1.25;height:2.6em;overflow:hidden}
.more{display:block;margin:18px auto;padding:12px 28px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;font-family:inherit;font-size:.85rem;cursor:pointer}
.more:hover{border-color:var(--accent)}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:24px 0}
footer{border-top:1px solid var(--border);padding:20px 16px;text-align:center;margin-top:20px}
footer p{font-size:.68rem;color:var(--muted);line-height:1.7}
footer a{color:var(--muted);text-decoration:none}
</style>
</head>
<body>
<nav><a class="logo" href="/">DEGENARCADE</a><span class="pill">Free · No Login</span></nav>

<div class="wrap">
  <div class="hero">
    <h1>Pick your poison.<br/><em>Zero excuses.</em></h1>
    <p>Two legends. Hundreds more below. Everything plays right here.</p>
  </div>

  <!-- THE TWO OPTIONS -->
  <div class="picks" id="picks">
    <button class="pick slope" data-url="https://slope-unblocked.github.io/" data-title="Slope" data-hint="← → keys or tap sides · Survive as long as you can">
      <div class="bg"><img src="img/slope.jpg" alt="" onerror="this.remove()"><div class="wm">Slope</div></div>
      <div class="info"><div class="nm">Slope</div><span class="tg">🔥 Most Played</span><span class="play">▶ PLAY</span></div>
    </button>
    <button class="pick gd" data-url="https://geometry-dash-game.github.io/" data-title="Geometry Dash" data-hint="Space or tap · Time your jumps">
      <div class="bg"><img src="img/geometry-dash.jpg" alt="" onerror="this.remove()"><div class="wm">Geometry<br>Dash</div></div>
      <div class="info"><div class="nm">Geometry Dash</div><span class="tg">📈 Viral</span><span class="play">▶ PLAY</span></div>
    </button>
  </div>

  <!-- PLAYER (opens in place, no redirect) -->
  <div id="player">
    <div class="ph"><span class="t" id="pt"></span>
      <div class="btns"><button class="btn" id="fs">⛶ Full</button><button class="btn" id="cl">✕ Close</button></div></div>
    <div class="frame" id="frame"><div class="ldr" id="ldr"><div class="ring"></div></div></div>
    <div class="pf" id="pf"></div>
  </div>

  <!-- NATIVE BANNER (one per page: the container id must be unique) -->
  <div class="adw">
    <script async="async" data-cfasync="false" src="https://pl29753476.profitableratecpmnetwork.com/738c225236e24ffb39c9161fd85a435a/invoke.js"></script>
    <div id="container-738c225236e24ffb39c9161fd85a435a"></div>
  </div>

  <!-- BROWSE -->
  <div class="bar"><input id="q" type="search" placeholder="Search games…" autocomplete="off"/></div>
  <div class="chips" id="chips"></div>
  <h2 class="sec" id="sec">More games</h2>
  <div class="grid" id="grid"></div>
  <div class="empty" id="status">Loading games…</div>
  <button class="more" id="more" style="display:none">Load more games</button>
</div>

<footer>
  <p><b>DEGENARCADE</b><br/>Free browser games. No downloads. No BS.<br/>
  <a href="#">Privacy Policy</a> · <a href="mailto:hello@degenarcade.online">Contact</a></p>
</footer>

<script>
(function(){
  var FEED='https://gamemonetize.com/feed.php?format=0&num=100&page=';
  var ALL=[], seen={}, page=0, loading=false, cat='All', query='', shown=0, PER=36, done=false;
  var $=function(i){return document.getElementById(i)};
  // small built-in fallback so the grid is never empty
  var FALLBACK=[
    {id:'87638',title:'IRONWAKE: Tank Combat',url:'https://html5.gamemonetize.co/uwucxieotni7lpxfgha1mzigh0xgzc1z/',category:'Adventure',thumb:'https://img.gamemonetize.com/uwucxieotni7lpxfgha1mzigh0xgzc1z/512x384.jpg',width:'900',height:'600'},
    {id:'87713',title:'Pro Football Eleven 2027',url:'https://html5.gamemonetize.co/nsvqmdi6fps4dvi4a2n3yvnnvnq73ost/',category:'Sports',thumb:'https://img.gamemonetize.com/nsvqmdi6fps4dvi4a2n3yvnnvnq73ost/512x384.jpg',width:'920',height:'600'}
  ];

  /* ---------- player ---------- */
  function openGame(url,title,hint){
    var fr=$('frame');
    var old=fr.querySelector('iframe'); if(old) old.remove();
    $('ldr').classList.remove('h');
    var f=document.createElement('iframe');
    f.src=url; f.title=title; f.allow='fullscreen; autoplay; gamepad'; f.allowFullscreen=true;
    // sandbox without allow-top-navigation / allow-popups: games cannot redirect or open other tabs
    f.setAttribute('sandbox','allow-scripts allow-same-origin allow-pointer-lock allow-forms');
    f.onload=function(){$('ldr').classList.add('h')};
    fr.appendChild(f);
    setTimeout(function(){$('ldr').classList.add('h')},7000);
    $('pt').textContent=title; $('pf').textContent=hint||'Tap the game to start · use Full for the best view';
    $('player').classList.add('on');
    $('player').scrollIntoView({behavior:'smooth',block:'start'});
  }
  function closeGame(){
    var f=$('frame').querySelector('iframe'); if(f) f.remove();
    $('player').classList.remove('on');
  }
  $('cl').onclick=closeGame;
  $('fs').onclick=function(){var f=$('frame');var fn=f.requestFullscreen||f.webkitRequestFullscreen;if(fn)fn.call(f)};
  Array.prototype.forEach.call(document.querySelectorAll('.pick'),function(b){
    b.onclick=function(){openGame(b.dataset.url,b.dataset.title,b.dataset.hint)};
  });

  /* ---------- feed ---------- */
  function add(list){
    list.forEach(function(g){
      if(!g||!g.url||!g.title||seen[g.id]) return;
      seen[g.id]=1; ALL.push(g);
    });
  }
  function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}
  function loadPage(){
    if(loading||done) return Promise.resolve();
    loading=true; page++;
    // try direct, then the optional /api/games proxy (fixes CORS if the feed blocks browsers)
    return getJSON(FEED+page).catch(function(){return getJSON('/api/games?page='+page)})
      .then(function(d){ if(!Array.isArray(d)||!d.length){done=true;return} add(d); })
      .catch(function(){ if(!ALL.length) add(FALLBACK); done=true; })
      .then(function(){loading=false; render(true)});
  }

  /* ---------- browse ---------- */
  function cats(){
    var c={}; ALL.forEach(function(g){c[g.category]=(c[g.category]||0)+1});
    var names=Object.keys(c).sort(function(a,b){return c[b]-c[a]}).slice(0,12);
    var el=$('chips'); el.innerHTML='';
    ['All'].concat(names).forEach(function(n){
      var b=document.createElement('button'); b.className='chip'+(n===cat?' on':''); b.textContent=n;
      b.onclick=function(){cat=n;shown=0;render(false)}; el.appendChild(b);
    });
  }
  function filtered(){
    var q=query.toLowerCase();
    return ALL.filter(function(g){
      return (cat==='All'||g.category===cat)&&(!q||g.title.toLowerCase().indexOf(q)>-1||(g.tags||'').toLowerCase().indexOf(q)>-1);
    });
  }
  function render(keep){
    cats();
    var list=filtered();
    if(!keep||!shown) shown=Math.min(PER,list.length); else shown=Math.max(shown,Math.min(PER,list.length));
    var grid=$('grid'); grid.innerHTML='';
    list.slice(0,shown).forEach(function(g){
      var b=document.createElement('button'); b.className='g';
      var im=document.createElement('img'); im.loading='lazy'; im.alt=''; im.src=g.thumb;
      var sp=document.createElement('span'); sp.textContent=g.title;
      b.appendChild(im); b.appendChild(sp);
      b.onclick=function(){openGame(g.url,g.title,g.instructions?stripHtml(g.instructions).slice(0,140):'')};
      grid.appendChild(b);
    });
    $('status').textContent=list.length?'':(loading?'Loading games…':'No games found. Try another search.');
    $('more').style.display=(shown<list.length||!done)&&list.length?'block':'none';
  }
  function stripHtml(s){var d=document.createElement('div');d.innerHTML=s;return d.textContent||''}

  $('more').onclick=function(){
    var list=filtered();
    if(shown+PER<=list.length){shown+=PER;render(true);return}
    if(!done){loadPage().then(function(){shown+=PER;render(true)})} else {shown=list.length;render(true)}
  };
  var t; $('q').oninput=function(){clearTimeout(t);t=setTimeout(function(){query=$('q').value.trim();shown=0;render(false)},200)};

  loadPage().then(function(){ if(!done) loadPage(); });   // preload ~200 games
})();
</script>
</body>
