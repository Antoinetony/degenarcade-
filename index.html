<style>
:root{--bg:#08080f;--surface:#0e0e1c;--card:#13132a;--border:#1e1e3a;--accent:#e63946;--gold:#f4a261;--text:#eeeeff;--muted:#7a7ab8;--r:12px;--fd:'Arial Black',Impact,sans-serif;--fb:'Segoe UI',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:70px}
nav{position:sticky;top:0;z-index:200;background:rgba(8,8,15,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{font-family:var(--fd);font-size:clamp(1rem,4vw,1.3rem);background:linear-gradient(90deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;letter-spacing:-.5px}
.pill{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:.65rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase}

/* glowing side margins */
body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:clamp(14px,5vw,70px);pointer-events:none;z-index:1;animation:glow 4s ease-in-out infinite alternate}
body::before{left:0;background:linear-gradient(90deg,rgba(230,57,70,.55),rgba(244,162,97,.18) 55%,transparent);box-shadow:inset 3px 0 14px rgba(230,57,70,.9)}
body::after{right:0;background:linear-gradient(270deg,rgba(124,92,255,.55),rgba(230,57,70,.18) 55%,transparent);box-shadow:inset -3px 0 14px rgba(124,92,255,.9);animation-delay:-2s}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.wrap{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:0 14px}
.hero{text-align:center;padding:26px 0 6px}
.hero h1{font-family:var(--fd);font-size:clamp(1.5rem,6.5vw,2.4rem);line-height:1.1;letter-spacing:-1px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:.82rem;color:var(--muted);margin-top:6px}

h2.sec{font-family:var(--fd);font-size:clamp(.95rem,4vw,1.2rem);margin:22px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
h2.sec span{background:linear-gradient(90deg,var(--gold),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* game cards */
.picks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.picks{grid-template-columns:1fr}}
.pick{position:relative;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--card);aspect-ratio:16/10;display:flex;align-items:flex-end;padding:0;color:var(--text);text-align:left;font-family:inherit;transition:transform .15s,border-color .15s}
.pick:hover{transform:translateY(-3px)}
.pick:active{transform:scale(.98)}
.pick .bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pick .bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:.9}
.pick .bg .wm{position:relative;z-index:0;font-family:var(--fd);text-transform:uppercase;text-align:center;line-height:.95;letter-spacing:-1px;font-size:clamp(1.6rem,7vw,2.6rem);padding:0 8px}
/* per-game glow themes */
.pick.g2048 .bg{background:radial-gradient(circle at 50% 35%,#123a5a 0%,#060d16 75%)}
.pick.g2048 .wm{color:#eaf6ff;text-shadow:0 0 6px #4cc2ff,0 0 18px #2b9fe0,0 0 38px #2b9fe0}
.pick.g2048{animation:pg2048 2.6s ease-in-out infinite alternate}
@keyframes pg2048{from{box-shadow:0 0 8px rgba(76,194,255,.35),0 0 0 1px rgba(76,194,255,.5)}to{box-shadow:0 0 28px rgba(76,194,255,.85),0 0 0 1px rgba(76,194,255,.9)}}
.pick.flappy .bg{background:radial-gradient(circle at 50% 35%,#5a3a10 0%,#160e04 75%)}
.pick.flappy .wm{color:#fff6d8;text-shadow:0 0 6px #ffd23a,0 0 18px #ffb020,0 0 38px #ff8c1a}
.pick.flappy{animation:pfl 2.6s ease-in-out infinite alternate;animation-delay:-1.3s}
@keyframes pfl{from{box-shadow:0 0 8px rgba(255,178,32,.35),0 0 0 1px rgba(255,178,32,.5)}to{box-shadow:0 0 28px rgba(255,178,32,.85),0 0 0 1px rgba(255,210,58,.9)}}
.pick.slope .bg{background:radial-gradient(circle at 50% 35%,#0f5a3a 0%,#06140e 75%)}
.pick.slope .wm{color:#eafff4;text-shadow:0 0 6px #2dffa0,0 0 18px #19d982,0 0 38px #19d982;transform:skewY(-6deg)}
.pick.slope{animation:psl 2.6s ease-in-out infinite alternate}
@keyframes psl{from{box-shadow:0 0 8px rgba(45,255,160,.35),0 0 0 1px rgba(45,255,160,.5)}to{box-shadow:0 0 28px rgba(45,255,160,.85),0 0 0 1px rgba(45,255,160,.9)}}
.pick.gd .bg{background:radial-gradient(circle at 50% 35%,#5a1a6a 0%,#10061a 75%)}
.pick.gd .wm{font-size:clamp(1.2rem,5.6vw,2.1rem);color:#fff8d8;text-shadow:0 0 6px #ffd23a,0 0 18px #ff9f1a,0 0 38px #c24bff;-webkit-text-stroke:1px rgba(0,0,0,.4)}
.pick.gd{animation:pgd 2.6s ease-in-out infinite alternate;animation-delay:-1.3s}
@keyframes pgd{from{box-shadow:0 0 8px rgba(194,75,255,.35),0 0 0 1px rgba(194,75,255,.5)}to{box-shadow:0 0 28px rgba(194,75,255,.85),0 0 0 1px rgba(255,210,58,.8)}}

.pick .info{position:relative;z-index:2;width:100%;padding:12px;background:linear-gradient(transparent,rgba(8,8,15,.95) 60%)}
.pick .nm{font-family:var(--fd);font-size:1.05rem}
.pick .tg{display:inline-block;margin-top:4px;font-size:.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.pick .play{display:block;margin-top:8px;background:var(--accent);color:#fff;text-align:center;border-radius:8px;padding:9px;font-weight:700;font-size:.85rem;text-decoration:none}
.pick .play:hover{background:#ff4d5a}

.adw{margin:22px 0;min-height:60px;display:flex;align-items:center;justify-content:center;overflow:hidden}
footer{border-top:1px solid var(--border);padding:20px 16px;text-align:center;margin-top:26px}
footer p{font-size:.68rem;color:var(--muted);line-height:1.7}
footer a{color:var(--muted);text-decoration:none}
</style>

<script>
/* Every card links to game.html?id=KEY — a REAL page navigation,

var GAMES=[

GAMES.forEach(function(g){
  var a=document.createElement('a'); a.className='pick '+g.cls; a.href='game.html?id='+g.id;
  var bg=document.createElement('div'); bg.className='bg';
