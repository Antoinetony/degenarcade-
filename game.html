<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Playing – DegenArcade</title>
<meta name="description" content="Play free addictive browser games instantly. No download. No login."/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#08080f"/>

<!-- ADSTERRA SOCIAL BAR -->
<script src="https://pl29753475.profitableratecpmnetwork.com/8a/f1/92/8af19274f1834cbab3b978fbc49dfdd0.js"></script>

<style>
:root{--bg:#08080f;--surface:#0e0e1c;--card:#13132a;--border:#1e1e3a;--accent:#e63946;--gold:#f4a261;--text:#eeeeff;--muted:#7a7ab8;--r:12px;--fd:'Arial Black',Impact,sans-serif;--fb:'Segoe UI',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:70px}
nav{position:sticky;top:0;z-index:200;background:rgba(8,8,15,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{font-family:var(--fd);font-size:clamp(1rem,4vw,1.3rem);background:linear-gradient(90deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;letter-spacing:-.5px}
.back{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:.7rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;text-decoration:none}
.back:hover{border-color:var(--accent);color:var(--text)}
body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:clamp(14px,5vw,70px);pointer-events:none;z-index:1}
body::before{left:0;background:linear-gradient(90deg,rgba(230,57,70,.55),rgba(244,162,97,.18) 55%,transparent);box-shadow:inset 3px 0 14px rgba(230,57,70,.9)}
body::after{right:0;background:linear-gradient(270deg,rgba(124,92,255,.55),rgba(230,57,70,.18) 55%,transparent);box-shadow:inset -3px 0 14px rgba(124,92,255,.9)}
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:14px}
h1{font-family:var(--fd);font-size:clamp(1.2rem,5vw,1.8rem);letter-spacing:-.5px;display:flex;align-items:center;gap:12px}
h1 img{width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid var(--border)}
.sub{font-size:.75rem;color:var(--muted);margin:4px 0 12px 56px}

/* the game itself */
.gwrap{position:relative;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:16/9}
@media(max-width:700px){.gwrap{aspect-ratio:4/3}}
.gwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.ldr{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#000;z-index:2;transition:opacity .4s}
.ldr.h{opacity:0;pointer-events:none}
.ring{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.ldr p{font-size:.7rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase}

/* play-again strip = another natural page view opportunity */
.again{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.again a{flex:1;min-width:150px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:.8rem;color:var(--text);text-decoration:none;font-weight:600}
.again a:hover{border-color:var(--accent)}
.again a.hot{background:var(--accent);border-color:var(--accent);color:#fff}

.adw{margin:22px 0;min-height:60px;display:flex;align-items:center;justify-content:center;overflow:hidden}
footer{border-top:1px solid var(--border);padding:20px 16px;text-align:center;margin-top:26px}
footer p{font-size:.68rem;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<nav><a class="logo" href="index.html">DEGENARCADE</a><a class="back" href="index.html">← More games</a></nav>

<div class="wrap">
  <h1><img id="lg" alt=""/><span id="nm"></span></h1>
  <div class="sub" id="sb"></div>

  <div class="gwrap">
    <div class="ldr" id="ldr"><div class="ring"></div><p>Loading game…</p></div>
  </div>

  <!-- plays on THIS page, but the links are real navigations back = more page views -->
  <div class="again" id="again"></div>

  <!-- NATIVE BANNER (container id must be unique) -->
  <div class="adw">
    <script async="async" data-cfasync="false" src="https://pl29753476.profitableratecpmnetwork.com/738c225236e24ffb39c9161fd85a435a/invoke.js"></script>
    <div id="container-738c225236e24ffb39c9161fd85a435a"></div>
  </div>
</div>

<footer><p><b>DEGENARCADE</b> · Free browser games · <a href="index.html" style="color:var(--muted)">Home</a></p></footer>

<script>
/* keep in sync with index.html */
var GAMES={
  g2048:{name:'2048',tag:'Swipe or arrow keys to merge tiles. Reach 2048 — if you can.',url:'https://gabrielecirulli.github.io/2048/',img:'https://gabrielecirulli.github.io/2048/meta/og_image.png'},
  flappy:{name:'Flappy Bird',tag:'One click, one flap. Infuriatingly addictive.',url:'https://html5.gamemonetize.co/g7c8wa9jccqy56jw9ahxb0aqjx6p2zwa/',img:'https://img.gamemonetize.com/g7c8wa9jccqy56jw9ahxb0aqjx6p2zwa/512x384.jpg'},
  slope:{name:'Slope',tag:'Steer the ball with ← →. How long can you survive?',url:'https://html5.gamemonetize.co/2tscjd5hjy09sm7owo0saawmk6lbo3i3/',img:'https://img.gamemonetize.com/2tscjd5hjy09sm7owo0saawmk6lbo3i3/512x384.jpg'},
  gd:{name:'Geometry Dash',tag:'Click or Space to jump. Timing is everything.',url:'https://html5.gamemonetize.co/p2p9llsb78ugrgqzp95x9a6gon3nvvfo/',img:'https://img.gamemonetize.com/p2p9llsb78ugrgqzp95x9a6gon3nvvfo/512x384.jpg'}
};
var id=new URLSearchParams(location.search).get('id')||'slope';
var g=GAMES[id]||GAMES.slope;
document.title=g.name+' – Play Free | DegenArcade';
document.getElementById('nm').textContent=g.name;
document.getElementById('sb').textContent=g.tag;
var lg=document.getElementById('lg'); lg.src=g.img; lg.onerror=function(){lg.style.display='none'};

var f=document.createElement('iframe');
f.src=g.url; f.title=g.name; f.allow='fullscreen; autoplay; gamepad; accelerometer; gyroscope'; f.allowFullscreen=true;
f.setAttribute('sandbox','allow-scripts allow-same-origin allow-pointer-lock allow-forms');
f.onload=function(){document.getElementById('ldr').classList.add('h')};
document.querySelector('.gwrap').appendChild(f);
setTimeout(function(){document.getElementById('ldr').classList.add('h')},8000);

/* links to the other games — every click is a fresh page view */
var again=document.getElementById('again');
Object.keys(GAMES).forEach(function(k){
  if(k===id) return;
  var a=document.createElement('a'); a.href='game.html?id='+k;
  a.textContent='▶ '+GAMES[k].name; if(k==='g2048') a.className='hot';
  again.appendChild(a);
});
var home=document.createElement('a'); home.href='index.html'; home.textContent='← All games';
again.appendChild(home);
</script>
</body>
</html>
